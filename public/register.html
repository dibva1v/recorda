<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recorda — Register Student</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container narrow">
    <h2 class="page-title" id="form-title">Register Student</h2>

    <div class="card">
      <form id="student-form" novalidate>
        <p id="form-error" class="error"></p>

        <div class="field-row">
          <div>
            <label for="student_number">Student Number</label>
            <input id="student_number" name="student_number" placeholder="STU-YYYY-NNNN" />
          </div>
          <div>
            <label for="enrollment_date">Enrollment Date</label>
            <input id="enrollment_date" name="enrollment_date" type="date" />
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="first_name">First Name</label>
            <input id="first_name" name="first_name" />
          </div>
          <div>
            <label for="last_name">Last Name</label>
            <input id="last_name" name="last_name" />
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" />
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="date_of_birth">Date of Birth</label>
            <input id="date_of_birth" name="date_of_birth" type="date" />
          </div>
          <div>
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">—</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="department_id">Department</label>
            <select id="department_id" name="department_id">
              <option value="">Select…</option>
            </select>
          </div>
          <div>
            <label for="year_level">Year Level</label>
            <select id="year_level" name="year_level">
              <option value="">—</option>
              <option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>

        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
          <option value="graduated">Graduated</option>
        </select>

        <label for="address">Address</label>
        <textarea id="address" name="address"></textarea>

        <div class="flex gap-2" style="margin-top: 8px;">
          <button type="submit">Save</button>
          <a class="btn secondary" href="students.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
  <script>initRegister();</script>
</body>
</html>
