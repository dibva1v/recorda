<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recorda — Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <img src="logo.png" alt="Recorda logo" class="brand-logo" />
        <p class="sub">University Student Records Management</p>
        <form id="login-form" novalidate>
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autofocus
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
          />

          <p id="login-error" class="error"></p>

          <button type="submit" style="width: 100%">Log In</button>
        </form>
        <p class="muted text-sm" style="margin-top: 16px; text-align: center">
          Demo credentials: <code>admin / admin123</code>
        </p>
      </div>
    </div>
    <script src="app.js"></script>
    <script>
      initLogin();
    </script>
  </body>
</html>
